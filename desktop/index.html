<!doctype html>
<html lang="en" style="background:#041c1c">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>ARIA by aeswox</title>
    <!-- Boot splash: pure HTML + CSS (CSP forbids inline scripts), painted from the first frame so the
         window is never white. main.tsx removes it once the app has mounted. -->
    <style>
      html, body { margin: 0; background: #050608; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 2147483001;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;
        background:
          radial-gradient(ellipse at 50% 34%, rgba(92, 242, 196, 0.10) 0%, rgba(92, 242, 196, 0) 46%),
          radial-gradient(ellipse at 50% 118%, rgba(96, 76, 190, 0.12) 0%, rgba(96, 76, 190, 0) 58%),
          linear-gradient(158deg, #0c0f15 0%, #07090d 52%, #020304 100%);
        color: #dcece7;
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        transition: opacity 0.4s ease;
      }
      #boot-splash .bs-ring {
        width: 132px; height: 132px;
        overflow: visible; /* the glow must not be clipped into a square */
      }
      #boot-splash .bs-ring circle { fill: none; stroke-width: 3; stroke-linecap: round; }
      #boot-splash .bs-ring .bs-track { stroke: rgba(220, 236, 231, 0.10); }
      #boot-splash .bs-ring .bs-arc {
        stroke: #5cf2c4; stroke-dasharray: 90 270; transform-origin: 66px 66px;
        animation: bs-spin 1.4s linear infinite;
      }
      #boot-splash .bs-halo {
        position: absolute; left: 50%; top: 50%; width: 190px; height: 190px;
        transform: translate(-50%, -50%); border-radius: 50%;
        background: radial-gradient(circle, rgba(92, 242, 196, 0.22) 0%, rgba(92, 242, 196, 0) 68%);
        pointer-events: none;
      }
      #boot-splash .bs-ring text {
        fill: #e7f7f1; font-size: 26px; font-weight: 700; letter-spacing: 3px;
        text-anchor: middle; dominant-baseline: central;
      }
      #boot-splash .bs-phrases { position: relative; width: min(86vw, 620px); height: 3.1em; text-align: center; font-size: 14px; letter-spacing: 0.12em; }
      #boot-splash .bs-phrases span {
        position: absolute; inset: 0; opacity: 0; animation: bs-phrase 15s infinite backwards;
        display: flex; flex-direction: column; gap: 3px;
      }
      #boot-splash .bs-phrases b { font-weight: 600; }
      #boot-splash .bs-phrases i { font-style: normal; opacity: 0.72; font-size: 0.92em; }
      #boot-splash .bs-phrases span:nth-child(2) { animation-delay: 3s; }
      #boot-splash .bs-phrases span:nth-child(3) { animation-delay: 6s; }
      #boot-splash .bs-phrases span:nth-child(4) { animation-delay: 9s; }
      #boot-splash .bs-phrases span:nth-child(5) { animation-delay: 12s; }
      #boot-splash .bs-bar { width: 180px; height: 2px; overflow: hidden; background: rgba(220, 236, 231, 0.10); border-radius: 2px; }
      #boot-splash .bs-bar i {
        display: block; width: 40%; height: 100%; background: #5cf2c4; border-radius: 2px;
        box-shadow: 0 0 8px rgba(92, 242, 196, 0.9); animation: bs-slide 1.3s ease-in-out infinite;
      }
      @keyframes bs-spin { to { transform: rotate(360deg); } }
      @keyframes bs-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      @keyframes bs-phrase {
        0% { opacity: 0; transform: translateY(6px); }
        4%, 22% { opacity: 1; transform: none; }
        26%, 100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .bs-ring .bs-arc, #boot-splash .bs-bar i { animation: none; }
        #boot-splash .bs-phrases span { animation: none; opacity: 0; }
        #boot-splash .bs-phrases span:first-child { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite">
      <div style="position:relative;width:132px;height:132px;display:flex;align-items:center;justify-content:center">
        <div class="bs-halo" aria-hidden="true"></div>
        <svg class="bs-ring" viewBox="0 0 132 132" aria-hidden="true">
          <circle class="bs-track" cx="66" cy="66" r="54" />
          <circle class="bs-arc" cx="66" cy="66" r="54" />
          <text x="66" y="67">ARIA</text>
        </svg>
      </div>
      <div class="bs-phrases">
        <span><b>WAKING THE AGENTS…</b><i>бужу агентов</i></span>
        <span><b>WIRING THE NEURONS…</b><i>соединяю нейроны</i></span>
        <span><b>READING YOUR PROJECT…</b><i>читаю твой проект</i></span>
        <span><b>SHARPENING THE PLAN…</b><i>точу план</i></span>
        <span><b>ARIA IS ALMOST HERE…</b><i>АРИЯ почти на месте</i></span>
      </div>
      <div class="bs-bar" aria-hidden="true"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
